name: Release

# Tag-driven release: pushing a tag like v0.3.0 builds the CLI binaries and
# the VS Code extension VSIX, runs the full test suite as a gate, and attaches
# everything to a GitHub Release.
#
# Marketplace publishing is intentionally a separate, manual decision — see
# the commented step at the bottom (requires a VSCE_PAT secret and a
# registered publisher).

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # create the GitHub Release + upload assets

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build

  cli:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [ win-x64, linux-x64, osx-x64, osx-arm64 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish lysc (${{ matrix.rid }})
        # NOT single-file, and ReadyToRun instead. The startup cost a one-bar
        # score pays before any music is engraved is the whole fixed term, and
        # PublishSingleFile owns most of it: the host unpacks the bundle on
        # every invocation. MEASURED (win-x64, Release, floor of 8, one bar):
        # single-file+compressed 1694 ms, plain directory 1184, directory with
        # ReadyToRun 862 -- half the fixed cost is the bundle, not the JIT.
        # ReadyToRun only pays once the bundle is gone: UNDER single-file it
        # made startup WORSE (--version 545 -> 1093 ms), because R2R takes the
        # payload from 36.8 to 50.7 MB and the host has to unpack all of it.
        # The archive below is a zip/tarball either way, so the bundle was
        # buying nothing a directory does not.
        # Output is byte-identical to the previously shipped configuration
        # (svg and midi, three scores, compared by hash).
        run: >
          dotnet publish LilySharp.Cli/LilySharp.Cli.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained
          -p:PublishReadyToRun=true
          -p:Version=${GITHUB_REF_NAME#v}
          -o publish/${{ matrix.rid }}
      - name: Archive
        # Everything THIRD-PARTY-NOTICES.md points at has to travel with the
        # binary, or the notices name licenses the recipient never receives:
        # the Apache-2.0 text (Six Labors), the upstream notices for the Skia
        # and HarfBuzz natives, and the list of ported LilyPond files with
        # their authors' copyright lines.
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.md THIRD-PARTY-NOTICES-SkiaSharp.txt \
             LICENSE-Apache-2.0.txt LILYPOND-ATTRIBUTION.md publish/${{ matrix.rid }}/
          cd publish/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            zip -r ../../lysc-${{ github.ref_name }}-${{ matrix.rid }}.zip .
          else
            tar czf ../../lysc-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz .
          fi
      - name: Extract release notes
        # The topmost CHANGELOG section is the version being tagged (stated in
        # CHANGELOG.md itself). The heading line is dropped — the Release is
        # already titled with the tag.
        run: awk '/^## /{n++; next} n==1' CHANGELOG.md > RELEASE_NOTES.md
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            lysc-*.zip
            lysc-*.tar.gz

  vsix:
    needs: test
    runs-on: ubuntu-latest
    # ONE VSIX PER PLATFORM, each carrying its own .NET runtime.
    #
    # This job published the server framework-dependent until 2026-08-21, so a single
    # vsix served every OS and every user had to install the .NET 10 runtime first.
    # On the Marketplace that is the worst possible failure: the extension installs,
    # syntax highlighting works, and nothing else does - no diagnostics, no completion,
    # no preview - because the server never starts. Half-alive is harder to diagnose
    # than broken, and the extension README claimed no runtime was needed anyway.
    #
    # extension.ts already prefers this shape: it probes server/ for coreclr and runs
    # the apphost DIRECTLY when it finds it, falling back to `dotnet <dll>` only for a
    # framework-dependent build (which is what `dotnet publish` still gives local dev).
    # Nothing in the TypeScript changed for this - only what the pipeline hands it.
    #
    # RID -> VS Code target. The four in the cli job above are proven to cross-compile
    # R2R from this ubuntu runner; the two arm64 legs are NOT, and are here because
    # leaving a platform out is worse than the runtime prompt was - VS Code offers such
    # users nothing at all rather than a fallback. If a leg fails at tag time, drop
    # PublishReadyToRun for it: R2R is a startup optimisation, not a correctness one.
    strategy:
      matrix:
        include:
          - { rid: win-x64,    target: win32-x64   }
          - { rid: win-arm64,  target: win32-arm64 }
          - { rid: linux-x64,  target: linux-x64   }
          - { rid: linux-arm64, target: linux-arm64 }
          - { rid: osx-x64,    target: darwin-x64  }
          - { rid: osx-arm64,  target: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish LSP server into the extension (${{ matrix.rid }})
        # Self-contained, so the vsix needs no .NET on the user's machine.
        # NOT single-file, and ReadyToRun - the same pair the cli job settled on and
        # for the same measured reason: PublishSingleFile makes the host unpack the
        # bundle on every launch, and this launches every time a .lys is opened.
        run: >
          dotnet publish LilySharp.Lsp/LilySharp.Lsp.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained
          -p:PublishReadyToRun=true
          -p:Version=${GITHUB_REF_NAME#v}
          -o editors/vscode/server
      - name: Mark the apphost executable
        # The mode has to be right BEFORE vsce zips it: a server that ships without
        # +x fails to spawn on macOS and Linux with a bare EACCES, which reads like a
        # corrupt install. No-op for the windows legs.
        run: chmod +x editors/vscode/server/lilysharp-lsp || true
      - name: Bundle the license and third-party notices
        # Same set as the CLI archives: the notices are only complete if the
        # texts they refer to ship beside them.
        run: |
          cp LICENSE editors/vscode/LICENSE
          cp THIRD-PARTY-NOTICES.md editors/vscode/THIRD-PARTY-NOTICES.md
          cp THIRD-PARTY-NOTICES-SkiaSharp.txt editors/vscode/THIRD-PARTY-NOTICES-SkiaSharp.txt
          cp LICENSE-Apache-2.0.txt editors/vscode/LICENSE-Apache-2.0.txt
          cp LILYPOND-ATTRIBUTION.md editors/vscode/LILYPOND-ATTRIBUTION.md
      - name: Sync extension version to tag
        working-directory: editors/vscode
        # v0.3.0 → 0.3.0; "|| true" tolerates an already-matching version.
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}" || true
      - name: Build VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx @vscode/vsce package --pre-release --target ${{ matrix.target }}
      - name: Extract release notes
        # Same extraction as the CLI job: whichever upload step runs first
        # creates the Release, so both must carry the body or the winner
        # decides whether the notes exist.
        run: awk '/^## /{n++; next} n==1' CHANGELOG.md > RELEASE_NOTES.md
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: editors/vscode/*.vsix

      # Marketplace publication is a deliberate, separate decision.
      # To enable: register the publisher, create a Personal Access Token,
      # store it as the VSCE_PAT repository secret, then uncomment:
      #
      # - name: Publish to VS Code Marketplace
      #   working-directory: editors/vscode
      #   run: >
      #     npx @vscode/vsce publish --pre-release
      #     --target ${{ matrix.target }}
      #     -p ${{ secrets.VSCE_PAT }}
      #
      # Each matrix leg publishes its own platform build under one version, which is
      # how VS Code hands a user the package matching their machine.
